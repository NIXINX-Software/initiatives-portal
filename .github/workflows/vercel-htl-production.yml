name: Hot Tacos - Initiatives Portal (production)

# Deploy on changes merged into main; keep project and data under Hot Tacos.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: initiatives-portal-htl-production
  cancel-in-progress: false

jobs:
  deploy_htl_production:
    name: Publish Initiatives Portal to Hot Tacos production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_HOT_TACOS_LEAMINGTON_HTL }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID_HOT_TACOS_LEAMINGTON_HTL }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_HOT_TACOS_LEAMINGTON_HTL }}
    steps:
      - name: Checkout NIXINX source
        uses: actions/checkout@v4

      - name: Check destination configuration
        shell: bash
        run: |
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo 'Missing Hot Tacos Vercel deployment configuration.' >&2
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Download Hot Tacos production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build with production environment variables
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Publish to existing Hot Tacos production project
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
