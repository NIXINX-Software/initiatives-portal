name: Hot Tacos - Initiatives Portal (manual preview)

# Deliberately manual and preview-only. No push/PR trigger or production deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: initiatives-portal-htl-preview
  cancel-in-progress: false

jobs:
  preview_htl:
    name: Preview on Hot Tacos Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_HOT_TACOS_LEAMINGTON_HTL }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID_HOT_TACOS_LEAMINGTON_HTL }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_HOT_TACOS_LEAMINGTON_HTL }}
    steps:
      - name: Checkout NIXINX source
        uses: actions/checkout@v4

      - name: Verify deployment configuration is present
        shell: bash
        run: |
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo 'Missing HTL Vercel token, team ID or project ID in GitHub Actions settings.' >&2
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull client Vercel preview environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build preview artifacts
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Publish preview only (never production)
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"
